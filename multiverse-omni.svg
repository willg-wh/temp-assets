<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 61.38 702.62 168.63"
  width="200"
  height="48"
  color="black"
  role="img"
  aria-labelledby="wordmark-title wordmark-description"
>
  <title id="wordmark-title">Multiverse transforms into Omni</title>
  <desc id="wordmark-description">
    The Multiverse wordmark rearranges and transforms into Omni, then reverses
    into Multiverse.
  </desc>

  <g transform="translate(-120.28 0)" fill="currentColor">
    <!-- M slides right to become Omni's M. -->
    <g>
      <path d="M240.66,120.25h-18.74l-33.14,54.28v-54.28h-18.97l-33.02,53.93v-53.93h-16.51v81.71h16.63l35.37-58.13v58.13h16.63l35.25-57.55v57.55h16.51v-81.71Z"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;277.7 0;277.7 0;0 0;0 0"
        keyTimes="0;0.2;0.38;0.62;0.8;1"
        keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1"
        calcMode="spline"
        dur="6.4s"
        repeatCount="indefinite"
      />
    </g>

    <!-- U moves into place and turns upside down to form N. -->
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;277.7 0;277.7 0;0 0;0 0"
        keyTimes="0;0.2;0.38;0.62;0.8;1"
        keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1"
        calcMode="spline"
        dur="6.4s"
        repeatCount="indefinite"
      />
      <g>
        <path d="M310.1,166.24c0,13.42-8.08,21.59-19.21,21.59s-19.09-8.17-19.09-21.59v-45.99h-16.51v45.64c0,22.99,13,37.94,35.25,37.94s36.07-15.29,36.07-37.94v-45.64h-16.51v45.99Z"/>
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 290.95 161.1;0 290.95 161.1;180 290.95 161.1;180 290.95 161.1;0 290.95 161.1;0 290.95 161.1"
          keyTimes="0;0.2;0.38;0.62;0.8;1"
          keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1"
          calcMode="spline"
          dur="6.4s"
          repeatCount="indefinite"
        />
      </g>
    </g>

    <!-- I and its dot move together. -->
    <g>
      <path d="M453.09,120.25h-16.51v81.71h16.51v-81.71Z"/>
      <circle cx="444.77" cy="98.25" r="10.74"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 0;183.2 0;183.2 0;0 0;0 0"
        keyTimes="0;0.2;0.38;0.62;0.8;1"
        keySplines="0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1;0.65 0 0.35 1"
        calcMode="spline"
        dur="6.4s"
        repeatCount="indefinite"
      />
    </g>

